name = "memos-cloudflare"
main = "src/index.ts"
compatibility_date = "2024-06-01"

compatibility_flags = ["nodejs_compat"]

[vars]
LOG_LEVEL = "info"
# 留空则 instanceUrl 回退为请求 origin（单 Worker 同源部署推荐留空）
BASE_URL = ""

# Secrets - set via wrangler secret put
# JWT_SECRET
# ALLOWED_ORIGINS  
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY

# 单 Worker 同源部署：Worker 同时托管前端静态资源与 API
[assets]
directory = "../frontend/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "memos"
database_id = "b14d1661-a470-4fbd-bb71-f8600340ab54"

[[r2_buckets]]
binding = "R2"
bucket_name = "memos-assets"

[env.staging]
name = "memos-cloudflare-staging"

[env.production]
name = "memos-cloudflare-production" 